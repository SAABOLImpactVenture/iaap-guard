AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minimal stateless IaaP Guard public GitHub App beta runtime.

Parameters:
  GitHubAppId:
    Type: Number
    Description: Numeric GitHub App ID used as the JWT issuer.
  GitHubPrivateKeySecretArn:
    Type: String
    Description: AWS Secrets Manager ARN containing the GitHub App PEM private key as SecretString.
  GitHubWebhookSecretArn:
    Type: String
    Description: AWS Secrets Manager ARN containing the GitHub App webhook secret as SecretString.
  GuardReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    Description: Reserved Lambda concurrency for the public beta. Set to 0 to stop invocations in an emergency.

Resources:
  GuardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Stateless webhook adapter around the deterministic IaaP Guard core.
      CodeUri: ../../
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions:
        Ref: GuardReservedConcurrency
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          IAAP_GUARD_GITHUB_APP_ID:
            Ref: GitHubAppId
          IAAP_GUARD_GITHUB_PRIVATE_KEY_SECRET_ARN:
            Ref: GitHubPrivateKeySecretArn
          IAAP_GUARD_GITHUB_WEBHOOK_SECRET_ARN:
            Ref: GitHubWebhookSecretArn
          IAAP_GUARD_GITHUB_API_URL: https://api.github.com
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadOnlyGitHubAppSecrets
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - Ref: GitHubPrivateKeySecretArn
                - Ref: GitHubWebhookSecretArn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  GuardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${GuardFunction}
      RetentionInDays: 14

  GuardFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: IaaP Guard Lambda reported one or more errors in a one-minute period.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: GuardFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GuardFunctionThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: IaaP Guard Lambda reported one or more throttles in a one-minute period.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: GuardFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GuardFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: IaaP Guard Lambda duration approached the 60-second timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: GuardFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 50000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  WebhookUrl:
    Description: Public HTTPS endpoint to configure as the GitHub App webhook URL.
    Value:
      Fn::GetAtt:
        - GuardFunctionUrl
        - FunctionUrl
