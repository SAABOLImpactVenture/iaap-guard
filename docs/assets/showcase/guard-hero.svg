<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">IaaP Guard</title><desc id="desc">A GitHub-native deterministic architecture guard turns product-governance knowledge into executable pull-request checks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".30"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker><style>.k{font:800 17px Inter,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#86efac}.t{font:800 50px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:600 21px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.h{font:800 22px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.b{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}.pill{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}</style></defs><rect width="1600" height="720" rx="34" fill="url(#bg)"/><text x="72" y="66" class="k">EXECUTABLE PRODUCT GOVERNANCE</text><text x="72" y="126" class="t">Make architecture review executable.</text><text x="72" y="166" class="sub">IaaP Guard asks whether infrastructure is actually being engineered as a product — on every relevant PR.</text><g transform="translate(72,250)" filter="url(#s)"><rect width="300" height="220" rx="30" fill="#0d2438" stroke="#38bdf8" stroke-width="2"/><text x="30" y="52" class="h">Repository / PR</text><text x="30" y="92" class="b">product contracts</text><text x="30" y="122" class="b">experience definitions</text><text x="30" y="152" class="b">AI authority configs</text><text x="30" y="182" class="b">control-plane implementation</text></g><g transform="translate(510,215)" filter="url(#s)"><path d="M185 18 L330 70 V210 C330 292 270 360 185 397 C100 360 40 292 40 210 V70 Z" fill="url(#shield)"/><path d="M185 70 L278 104 V207 C278 260 242 307 185 336 C128 307 92 260 92 207 V104 Z" fill="#052e2b" opacity=".45"/><path d="M140 211 l32 32 72-90" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="440" text-anchor="middle" class="h">Deterministic IaaP Core</text></g><g transform="translate(1030,235)" filter="url(#s)"><rect width="498" height="260" rx="32" fill="#101b2d" stroke="#22c55e" stroke-width="2"/><text x="32" y="52" class="h">IaaP Guard / Architecture</text><rect x="32" y="82" width="434" height="48" rx="15" fill="#0c2a1c"/><text x="52" y="113" class="b">PASS — product abstraction</text><rect x="32" y="144" width="434" height="48" rx="15" fill="#33240d"/><text x="52" y="175" class="b">WARN — evidence path incomplete</text><rect x="32" y="206" width="210" height="32" rx="16" fill="#12341f"/><text x="137" y="228" text-anchor="middle" class="pill">coverage/v1 score</text></g><g stroke="#7dd3fc" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M372 360 H496"/><path d="M880 360 H1016"/></g><g transform="translate(72,575)"><rect width="1456" height="76" rx="24" fill="#101b2d" stroke="#334155"/><text x="30" y="32" class="h">Durable IP lives in the rules + evidence model, not the adapter.</text><text x="30" y="58" class="b">CLI • GitHub Action • public GitHub App → same classifier, parsers, versioned rules, normalized findings and transparent scoring</text></g></svg>