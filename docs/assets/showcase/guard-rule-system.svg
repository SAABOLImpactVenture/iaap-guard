<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc"><title id="title">IaaP Guard rule system</title><desc id="desc">Component classification routes repository context into product, experience, AI authority, control-plane, governance, evidence and co-management rules before scoring.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".28"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker><style>.t{font:800 40px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:600 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.h{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.b{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}.mono{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0}</style></defs><rect width="1600" height="660" rx="32" fill="url(#bg)"/><text x="72" y="70" class="t">Context first. Rules second. Score last.</text><text x="72" y="106" class="sub">The classifier keeps architecture checks aware of what a file or repository component is actually responsible for.</text><g transform="translate(72,165)" filter="url(#s)"><rect width="310" height="330" rx="28" fill="#0d2438" stroke="#38bdf8"/><text x="28" y="46" class="h">Component classifier</text><text x="28" y="84" class="b">consumer contract</text><text x="28" y="116" class="b">experience layer</text><text x="28" y="148" class="b">AI authority</text><text x="28" y="180" class="b">control-plane implementation</text><text x="28" y="212" class="b">bootstrap</text><text x="28" y="244" class="b">evidence</text><text x="28" y="276" class="b">documentation / fixtures</text><rect x="28" y="294" width="254" height="22" rx="11" fill="#12304a"/></g><g transform="translate(480,150)"><g filter="url(#s)"><rect width="280" height="110" rx="24" fill="#12341f" stroke="#22c55e"/><text x="24" y="38" class="h">Product rules</text><text x="24" y="67" class="mono">IAP-P001 • P002 • P003 • P004</text><text x="24" y="91" class="b">contract + ownership boundaries</text></g><g transform="translate(330)" filter="url(#s)"><rect width="280" height="110" rx="24" fill="#0d2438" stroke="#38bdf8"/><text x="24" y="38" class="h">Experience rules</text><text x="24" y="67" class="mono">IAP-X001</text><text x="24" y="91" class="b">storefront cannot provision</text></g><g transform="translate(660)" filter="url(#s)"><rect width="280" height="110" rx="24" fill="#26163f" stroke="#a855f7"/><text x="24" y="38" class="h">AI authority rules</text><text x="24" y="67" class="mono">IAP-A001 • A002</text><text x="24" y="91" class="b">no apply / bypass authority</text></g><g transform="translate(0,150)" filter="url(#s)"><rect width="280" height="110" rx="24" fill="#10294b" stroke="#3b82f6"/><text x="24" y="38" class="h">Control rules</text><text x="24" y="67" class="mono">IAP-C001</text><text x="24" y="91" class="b">consumer domain compatibility</text></g><g transform="translate(330,150)" filter="url(#s)"><rect width="280" height="110" rx="24" fill="#33240d" stroke="#f59e0b"/><text x="24" y="38" class="h">Governance rules</text><text x="24" y="67" class="mono">IAP-G001</text><text x="24" y="91" class="b">deterministic validation evidence</text></g><g transform="translate(660,150)" filter="url(#s)"><rect width="280" height="110" rx="24" fill="#35132d" stroke="#ec4899"/><text x="24" y="38" class="h">Evidence rules</text><text x="24" y="67" class="mono">IAP-E001 • CX01</text><text x="24" y="91" class="b">lifecycle/status + overlap warning</text></g></g><g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M382 330 H466"/><path d="M1420 330 H1480"/></g><g transform="translate(1180,505)" filter="url(#s)"><rect width="348" height="90" rx="24" fill="#18152d" stroke="#8b5cf6"/><text x="174" y="37" text-anchor="middle" class="h">coverage/v1</text><text x="174" y="64" text-anchor="middle" class="b">PASS / applicable • N/A excluded</text></g><g transform="translate(72,535)"><rect width="980" height="60" rx="20" fill="#101b2d" stroke="#334155"/><text x="24" y="26" class="b">Critical FAIL rules remain deterministic and testable.</text><text x="24" y="47" class="b">Experimental overlap detection stays non-scoring until evidence supports promotion.</text></g></svg>