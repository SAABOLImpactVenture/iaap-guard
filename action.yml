name: IaaP Guard

description: "Deterministic Infrastructure-as-a-Product architecture and evidence guard"

author: "SAABOL Impact Venture"

inputs:
  target:
    description: "Repository-relative path to scan"
    required: false
    default: "."
  output:
    description: "Repository-relative JSON result path"
    required: false
    default: "artifacts/iaap-guard/scan-result.json"
  fail-on-failure:
    description: "Fail the workflow step when IaaP Guard concludes failure"
    required: false
    default: "false"

outputs:
  conclusion:
    description: "IaaP Guard conclusion: success, neutral, or failure"
    value: ${{ steps.scan.outputs.conclusion }}
  score:
    description: "Overall coverage score, or empty when no scoring controls apply"
    value: ${{ steps.scan.outputs.score }}
  result-path:
    description: "Repository-relative path of the normalized scan-result/v1 JSON"
    value: ${{ steps.scan.outputs.result-path }}
  findings:
    description: "Number of WARNING/FAIL findings"
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: "composite"
  steps:
    - name: Install bounded runtime dependency
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

    - name: Run IaaP Guard
      id: scan
      shell: bash
      env:
        IAAP_GUARD_TARGET: ${{ inputs.target }}
        IAAP_GUARD_OUTPUT: ${{ inputs.output }}
        IAAP_GUARD_FAIL_ON_FAILURE: ${{ inputs.fail-on-failure }}
      run: |
        export PYTHONPATH="${GITHUB_ACTION_PATH}/src${PYTHONPATH:+:${PYTHONPATH}}"
        python "${GITHUB_ACTION_PATH}/scripts/github_action.py"
