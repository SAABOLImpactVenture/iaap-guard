name: IaaP Guard (retired Action)

description: "Retired composite Action; install the hosted IaaP Guard GitHub App"

author: "SAABOL Impact Venture"

inputs:
  target:
    description: "Retained only for compatibility with existing workflow syntax"
    required: false
    default: "."
  output:
    description: "Retained only for compatibility with existing workflow syntax"
    required: false
    default: "artifacts/iaap-guard/scan-result.json"
  fail-on-failure:
    description: "Retained only for compatibility with existing workflow syntax"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Explain IaaP Guard Action retirement
      shell: bash
      run: |
        echo "::error title=IaaP Guard Action retired::The public composite Action is retired. Install the supported hosted GitHub App at https://github.com/apps/iaap-guard and remove uses: SAABOLImpactVenture/iaap-guard@main from this workflow. Historical pinned revisions remain available but are unsupported."
        exit 1
