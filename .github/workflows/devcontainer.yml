name: Dev container portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify repository is documentation-first and toolchain-free
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .devcontainer
          test ! -e requirements.txt
          test ! -e requirements-ci.txt
          test ! -e Makefile
          test ! -e src
          test ! -e tests
