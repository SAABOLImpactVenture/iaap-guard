name: Dev container portability

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - '.gitignore'
      - 'requirements-*.txt'
      - 'Makefile'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - '.gitignore'
      - 'requirements-*.txt'
      - 'Makefile'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dev container and validate toolchain
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/verify-toolchain.sh
