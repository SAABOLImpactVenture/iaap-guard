name: Deploy IaaP Guard beta (AWS OIDC)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Action to perform against the existing beta stack
        required: true
        default: identity
        type: choice
        options:
          - identity
          - plan
          - deploy
      expected_sha:
        description: Required for deploy; must exactly match the selected main revision
        required: false
        type: string
      change_set_arn:
        description: Required for deploy; copy the exact ARN emitted by a successful plan run
        required: false
        type: string
      confirm:
        description: Required for deploy; enter DEPLOY exactly
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: iaap-guard-beta-deployment
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: '070096877875'
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::070096877875:role/IaaPGuardDeploymentRole
  STACK_NAME: iaap-guard-beta
  SAM_BUCKET: aws-sam-cli-managed-default-samclisourcebucket-0phxbvntr8eu
  SAM_VERSION: '1.165.0'
  GITHUB_APP_ID: '4529329'
  PRIVATE_KEY_ARN: arn:aws:secretsmanager:us-east-2:070096877875:secret:iaap-guard/github-private-key-FbqsiA
  WEBHOOK_SECRET_ARN: arn:aws:secretsmanager:us-east-2:070096877875:secret:iaap-guard/github-webhook-secret-B3m6bf

jobs:
  beta:
    name: ${{ inputs.operation }} beta
    runs-on: ubuntu-24.04

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow may run only from main. Current ref: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate deploy confirmation
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "DEPLOY" ]]; then
            echo "Deploy requires confirm=DEPLOY." >&2
            exit 1
          fi
          if [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "expected_sha must exactly match the selected main revision: $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -z "$CHANGE_SET_ARN" ]]; then
            echo "Deploy requires the exact change_set_arn emitted by the plan run." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: IaaPGuard-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Name:StackName,Status:StackStatus}' \
            --output table

      - name: Set up AWS SAM CLI
        if: ${{ inputs.operation == 'plan' }}
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: ${{ env.SAM_VERSION }}
          use-installer: true
          token: ${{ github.token }}

      - name: Build Phase 15 runtime
        if: ${{ inputs.operation == 'plan' }}
        shell: bash
        run: |
          set -euo pipefail
          sam --version
          sam build --template-file deploy/aws-lambda/template.yaml

      - name: Create non-executing CloudFormation change set
        if: ${{ inputs.operation == 'plan' }}
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/sam-plan.log"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$SAM_BUCKET" \
            --s3-prefix "iaap-guard-beta/$GITHUB_SHA" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "GitHubAppId=$GITHUB_APP_ID" \
              "GitHubPrivateKeySecretArn=$PRIVATE_KEY_ARN" \
              "GitHubWebhookSecretArn=$WEBHOOK_SECRET_ARN" \
              "GuardReservedConcurrency=5" \
              "GuardReservedConcurrencyEnabled=false" \
            --no-execute-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar 2>&1 | tee "$LOG_FILE"

          CHANGE_SET_ARN="$(grep -Eo 'arn:aws:cloudformation:[^[:space:]]+:changeSet/[^[:space:]]+' "$LOG_FILE" | tail -1 || true)"
          echo "change_set_arn=$CHANGE_SET_ARN" >> "$GITHUB_OUTPUT"

          {
            echo "## IaaP Guard beta plan"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Stack: \`$STACK_NAME\`"
            if [[ -n "$CHANGE_SET_ARN" ]]; then
              echo "- Change set: \`$CHANGE_SET_ARN\`"
            else
              echo "- Change set: none emitted (the stack may already match this revision)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect planned changes
        if: ${{ inputs.operation == 'plan' && steps.plan.outputs.change_set_arn != '' }}
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ steps.plan.outputs.change_set_arn }}
        run: |
          set -euo pipefail
          aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query '{Status:Status,ExecutionStatus:ExecutionStatus,Changes:Changes[].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}}' \
            --output json | tee "$RUNNER_TEMP/change-set.json"

          {
            echo
            echo '### CloudFormation change set'
            echo '```json'
            cat "$RUNNER_TEMP/change-set.json"
            echo '```'
            echo
            echo 'To execute this exact plan, rerun this workflow from the same main commit with:'
            echo '- operation: `deploy`'
            echo "- expected_sha: \`$GITHUB_SHA\`"
            echo "- change_set_arn: \`$CHANGE_SET_ARN\`"
            echo '- confirm: `DEPLOY`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate exact change set before execution
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          set -euo pipefail
          STACK_ID="$(aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'StackId' \
            --output text)"
          STATUS="$(aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Status' \
            --output text)"
          EXECUTION_STATUS="$(aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'ExecutionStatus' \
            --output text)"

          if [[ "$STACK_ID" != arn:aws:cloudformation:${AWS_REGION}:${AWS_ACCOUNT_ID}:stack/${STACK_NAME}/* ]]; then
            echo "Change set belongs to an unexpected stack: $STACK_ID" >&2
            exit 1
          fi
          if [[ "$STATUS" != "CREATE_COMPLETE" || "$EXECUTION_STATUS" != "AVAILABLE" ]]; then
            echo "Change set is not executable: status=$STATUS execution=$EXECUTION_STATUS" >&2
            exit 1
          fi

          aws cloudformation describe-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Changes[].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,Replacement:Replacement}' \
            --output table

      - name: Execute exact reviewed change set
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          set -euo pipefail
          aws cloudformation execute-change-set \
            --change-set-name "$CHANGE_SET_ARN" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

      - name: Verify deployed stack
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Updated:LastUpdatedTime,WebhookUrl:Outputs[?OutputKey==`WebhookUrl`]|[0].OutputValue}' \
            --output table

          FUNCTION_NAME="$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'StackResourceSummaries[?LogicalResourceId==`GuardFunction`].PhysicalResourceId | [0]' \
            --output text)"

          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,Version:Version,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output table

          {
            echo "## IaaP Guard beta deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Stack: \`$STACK_NAME\`"
            echo '- Result: CloudFormation update completed successfully'
          } >> "$GITHUB_STEP_SUMMARY"
