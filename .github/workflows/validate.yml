name: Phase 9 action and deterministic core validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: make validate

  dogfood-action:
    needs: validate-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Run IaaP Guard against itself
        id: guard
        uses: ./
        with:
          fail-on-failure: 'false'
          output: artifacts/iaap-guard/self-scan.json
      - name: Verify action evidence contract
        env:
          RESULT_PATH: ${{ steps.guard.outputs.result-path }}
          GUARD_CONCLUSION: ${{ steps.guard.outputs.conclusion }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ['RESULT_PATH']).read_text(encoding='utf-8'))
          assert result['schemaVersion'] == 'scan-result/v1'
          assert result['ruleCatalogVersion'] == 'iaap-guard/v0.1.2'
          assert result['scoringModelVersion'] == 'coverage/v1'
          assert result['repository']['name'] == os.environ['GITHUB_REPOSITORY']
          assert result['revision']['sha'] == os.environ['GITHUB_SHA']
          assert result['conclusion'] == os.environ['GUARD_CONCLUSION']
          assert not any(f['path'].startswith('fixtures/') and f['result'] == 'FAIL' for f in result['findings'])
          e001 = next(item for item in result['ruleResults'] if item['ruleId'] == 'IAP-E001')
          assert e001['result'] == 'NOT_APPLICABLE'
          assert not any(f['ruleId'] == 'IAP-E001' for f in result['findings'])
          print(f"verified self-scan: conclusion={result['conclusion']} score={result['overallScore']} findings={len(result['findings'])}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iaap-guard-self-scan
          path: artifacts/iaap-guard/self-scan.json
          if-no-files-found: error
