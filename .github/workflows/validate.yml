name: Phase 9 action and deterministic core validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate public contracts and distribution boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("schemas").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))

          forbidden = ["src", "rules", "tests", "fixtures", "deploy", "scripts", "lambda_function.py", "action.yml"]
          present = [path for path in forbidden if Path(path).exists()]
          if present:
              raise SystemExit(f"private implementation paths are present: {present}")

          print("public contracts and distribution boundary verified")
          PY

  dogfood-action:
    needs: validate-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify explicit migration guidance
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Composite Action retired" README.md
          grep -Fq "https://github.com/apps/iaap-guard" README.md
          test ! -e action.yml
          ! grep -Rq "PYTHONPATH=.*src\|scripts/github_action.py" README.md
