name: Phase 9 public program hub dogfood

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-program-hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate retained public assurance surface
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/phase-9/index.json
          test -s artifacts/phase-14/acceptance.json
          test -s config/github-app-v0.json
          test -s docs/ADOPTION-PREREQUISITES.md
          test -s docs/PRODUCT.md
          python3 -m json.tool config/github-app-v0.json >/dev/null
