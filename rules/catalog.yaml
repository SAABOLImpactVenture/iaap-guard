catalogVersion: iaap-guard/v0.1.1
scoringModelVersion: coverage/v1
resultSemantics:
  PASS: Applicable deterministic control has positive evidence.
  WARNING: Non-blocking product or evidence gap, or risk requiring human review.
  FAIL: Deterministic violation of a non-negotiable IaaP product or authority boundary.
  NOT_APPLICABLE: Required capability or context is absent; excluded from scoring.
dimensions:
  - Product Abstraction
  - Consumer Boundary
  - Experience / Authority
  - Control-Plane Separation
  - Governance
  - Evidence Readiness
rules:
  - id: IAP-P001
    title: Consumer contract exposes implementation machinery
    dimension: Consumer Boundary
    appliesTo: [consumer-contract, experience]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Stable consumer contracts
    evidenceRequirement: Consumer-facing schema, form, parameter, or order field exposes implementation topology that should be platform-owned.
    examples:
      prohibitedInConsumerSurface: [ProviderConfig, Composition, terraformWorkspace, tfeWorkspace, terraformModule, providerVersion, rawIamPolicy]
    recommendation: Move implementation selection behind the stable infrastructure product contract.

  - id: IAP-P002
    title: Consumer controls platform lifecycle policy
    dimension: Consumer Boundary
    appliesTo: [consumer-contract, experience]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Product-owned lifecycle
    evidenceRequirement: Consumer-facing desired state can select managed-resource deletion, orphaning, retention, or equivalent infrastructure lifecycle behavior owned by the product implementation.
    recommendation: Remove lifecycle implementation controls from the consumer contract and make them platform-owned.

  - id: IAP-X001
    title: Experience layer directly provisions infrastructure
    dimension: Experience / Authority
    appliesTo: [experience]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Replaceable experience layer
    evidenceRequirement: Storefront, portal, template, or consumer workflow directly invokes infrastructure apply, delete, or provider execution rather than submitting bounded product intent.
    recommendation: Make the experience layer create a reviewable product order or proposal and leave reconciliation to the product control plane.

  - id: IAP-A001
    title: AI receives infrastructure execution or credential authority
    dimension: Experience / Authority
    appliesTo: [ai-authority]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Bounded intelligence
    evidenceRequirement: AI tool/runtime policy grants direct apply/delete, cloud-admin, Kubernetes-admin, credential/secret access, Terraform/TFE run authority, or equivalent infrastructure execution.
    recommendation: Restrict AI to interpretation, proposal, explanation, sanitized diagnosis, and evidence assembly.

  - id: IAP-A002
    title: AI or automation bypasses accountable human approval
    dimension: Governance
    appliesTo: [ai-authority, experience, evidence]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Human authorization
    evidenceRequirement: AI or automation can self-approve, merge its own material infrastructure proposal, or bypass the declared human authorization boundary.
    recommendation: Restore an explicit accountable authorization step after deterministic validation and before execution.

  - id: IAP-C001
    title: Consumer accepted domain is broader than canonical product API
    dimension: Consumer Boundary
    appliesTo: [experience, consumer-contract]
    requiresPairedContexts: [experience, consumer-contract]
    violationResult: FAIL
    scoring: true
    experimental: false
    principle: Stable consumer contracts
    evidenceRequirement: Consumer/storefront constraints accept values outside the canonical product API, including broader enums, weaker minimums, broader maximums, or incompatible patterns.
    recommendation: Narrow the consumer surface so every accepted value is valid under the canonical product contract.

  - id: IAP-P003
    title: Infrastructure implementation lacks a recognizable product abstraction
    dimension: Product Abstraction
    appliesTo: [control-plane-implementation]
    excludes: [bootstrap]
    violationResult: WARNING
    scoring: true
    experimental: false
    principle: Product over tooling
    evidenceRequirement: Substantial infrastructure implementation is present without a stable consumer/product abstraction in scope.
    recommendation: Introduce a stable product contract that expresses outcomes while hiding implementation topology.

  - id: IAP-P004
    title: Product lacks accountable ownership metadata
    dimension: Product Abstraction
    appliesTo: [consumer-contract]
    violationResult: WARNING
    scoring: true
    experimental: false
    principle: Product accountability
    evidenceRequirement: Product contract has no required owner, team, or equivalent accountability metadata.
    recommendation: Require accountable product ownership metadata in the product request contract.

  - id: IAP-G001
    title: Governed change lacks deterministic validation evidence
    dimension: Governance
    appliesTo: [consumer-contract, experience, control-plane-implementation]
    violationResult: WARNING
    scoring: true
    experimental: false
    principle: Deterministic governance
    evidenceRequirement: Product-bearing analyzed scope has no recognizable deterministic test or validation path for the relevant architecture contract.
    recommendation: Add independently executable validation that proves the product boundary rather than relying on prose or CI presence alone.

  - id: IAP-E001
    title: Product implementation lacks status evidence or lifecycle path
    dimension: Evidence Readiness
    appliesTo: [consumer-contract, control-plane-implementation]
    violationResult: WARNING
    scoring: true
    experimental: false
    principle: Evidence first
    evidenceRequirement: Product-bearing scope has no recognizable machine-observable status, reconciliation-result, teardown, or lifecycle evidence path. Evidence-only tooling or validation repositories are not sufficient to make this rule applicable.
    recommendation: Add a machine-observable lifecycle and evidence path appropriate to the product architecture.

  - id: IAP-CX01
    title: Possible multiple authoritative reconcilers
    dimension: Control-Plane Separation
    appliesTo: [control-plane-implementation, bootstrap]
    violationResult: WARNING
    scoring: false
    experimental: true
    principle: One authoritative reconciler
    evidenceRequirement: Deterministic evidence suggests multiple active control paths may reconcile the same external resource or lifecycle domain; technology coexistence alone is insufficient.
    recommendation: Clarify authoritative resource ownership and remove active co-management or document a bounded migration handoff.
